<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music Aesthetic Miniplayer</title>
  <!-- Google Fonts: Plus Jakarta Sans (Apple OG Style) & Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-appleglass">
  <!-- CRT Screen Overlay (Active when toggled in retro themes) -->
  <div class="crt-overlay disabled" id="crtOverlay"></div>

  <!-- Main Container Card (Solid 100% Opaque, Edge-to-Edge Rounded, No Outer Drop Shadow) -->
  <div class="miniplayer-container" id="miniplayerContainer">
    <!-- Apple Music iOS 17 Animated Liquid Mesh Gradient Aura -->
    <div class="ambient-glow-layer" id="ambientGlowLayer">
      <div class="mesh-fluid-blob mesh-blob-1" id="glowOrb1"></div>
      <div class="mesh-fluid-blob mesh-blob-2" id="glowOrb2"></div>
      <div class="mesh-fluid-blob mesh-blob-3" id="glowOrb3"></div>
      <div class="mesh-fluid-blob mesh-blob-4" id="glowOrb4"></div>
    </div>
    
    <!-- Floating Exit Fullscreen Control (Apple Music Style) -->
    <button class="fullscreen-exit-btn hidden no-drag" id="btnExitFullscreen" title="Exit Fullscreen (Esc / F11)">
      <span>↙</span> Exit Fullscreen
    </button>

    <!-- 1. TOP HEADER: Track Info + Window Controls -->
    <header class="app-header drag-region">
      <div class="header-left">
        <!-- Album Art Thumbnail with Dynamic Glow Shadow -->
        <div class="art-thumb-box" id="artThumbBox">
          <img id="rawCoverImg" class="visible-cover" alt="Cover" crossorigin="anonymous">
          <canvas id="pixelCanvas" width="128" height="128" class="hidden-canvas"></canvas>
        </div>

        <!-- Track Text Stack -->
        <div class="header-track-meta no-drag">
          <div class="title-row">
            <h1 class="header-title" id="trackTitle">No Music Playing</h1>
            <span class="explicit-badge" id="explicitBadge">E</span>
          </div>
          <h2 class="header-subtitle" id="trackSubtitle">Apple Music</h2>
          
          <!-- Live Audio Quality Indicator Badge (Matches Apple Music Player Bar) -->
          <div class="audio-badge-row" id="badgeRow">
            <span class="badge-icon" id="badgeIcon">≋</span>
            <span class="badge-label" id="badgeLabel">Lossless</span>
          </div>
        </div>
      </div>

      <!-- Window Action Controls -->
      <div class="header-actions no-drag">
        <button class="win-btn win-btn-icon" id="btnFullscreen" title="Fullscreen (F / F11)">⛶</button>
        <button class="win-btn win-btn-icon" id="btnPin" title="Always on Top">📌</button>
        <button class="win-btn win-btn-icon" id="btnMin" title="Minimize">─</button>
        <button class="win-btn win-btn-icon win-btn-danger" id="btnClose" title="Close">✕</button>
      </div>
    </header>

    <!-- 2. CENTER: Full-Height Synced Karaoke Lyrics -->
    <main class="lyrics-view-area" id="lyricsViewArea">
      <div class="lyrics-scroll-container" id="lyricsContainer">
        <div class="lyrics-placeholder" id="lyricsPlaceholder">
          <div class="music-notes">♫ ♪ ♫</div>
          <p>Waiting for lyrics...</p>
          <span class="hint">Apple Music synced karaoke</span>
        </div>
        <div class="lyrics-list" id="lyricsList"></div>
      </div>
    </main>

    <!-- 3. BOTTOM: Timeline & Action / Transport Controls -->
    <footer class="app-controls-footer no-drag">
      <!-- Draggable / Scrubbable Seekbar Row -->
      <div class="timeline-row">
        <span class="time-label" id="timeCurrent">0:00</span>
        <div class="progress-bar-container" id="progressBarContainer" title="Timeline progress">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill"></div>
            <div class="progress-bar-thumb" id="progressBarThumb"></div>
          </div>
        </div>
        <span class="time-label" id="timeRemaining">-0:00</span>
      </div>

      <!-- Transport Buttons Row (Pure Clean White SVGs) -->
      <div class="buttons-row">
        <!-- Left group: Options -->
        <div class="btn-group-left">
          <button class="action-btn" id="btnMore" title="More Options">•••</button>
        </div>

        <!-- Center group: Playback controls (Clean SVGs) -->
        <div class="btn-group-center">
          <button class="ctrl-btn" id="btnPrev" title="Previous Track">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn ctrl-btn-play" id="btnPlayPause" title="Play/Pause">
            <svg class="icon-play" id="svgPlay" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause hidden" id="svgPause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnNext" title="Next Track">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <!-- Right group: Lyrics view & Theme popup menu trigger -->
        <div class="btn-group-right">
          <button class="action-btn active" id="btnToggleLyrics" title="Toggle Lyrics">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 12H7v-2h10v2zm0-3H7V9h10v2zm0-3H7V6h10v2z"/></svg>
          </button>
          <button class="action-btn" id="btnEngineMenu" title="Theme & Settings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- 4. Apple Music Volume HUD Overlay (Auto-Fading on Scroll) -->
    <div class="volume-hud-overlay hidden" id="volumeHudOverlay">
      <div class="volume-hud-card">
        <span class="volume-icon" id="volumeIcon">
          <svg class="vol-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </span>
        <div class="volume-bar-track">
          <div class="volume-bar-fill" id="volumeBarFill"></div>
        </div>
        <span class="volume-percent" id="volumePercent">100%</span>
      </div>
    </div>

    <!-- Pop-up Settings & Theme Selection Menu -->
    <div class="theme-popup-menu hidden" id="themePopupMenu">
      <div class="menu-header">
        <span class="menu-title">THEMES & EFFECTS</span>
        <button class="menu-close-btn" id="btnCloseMenu">✕</button>
      </div>

      <div class="menu-content">
        <!-- 1. Theme Section -->
        <div class="menu-section">
          <div class="section-label">THEME STYLE</div>
          <div class="theme-options-grid">
            <button class="theme-option-btn active" data-theme="0">
              <span class="theme-dot dot-appleglass"></span>
              <span class="theme-name">Apple Music OG</span>
            </button>
            <button class="theme-option-btn" data-theme="1">
              <span class="theme-dot dot-gameboy"></span>
              <span class="theme-name">GameBoy</span>
            </button>
            <button class="theme-option-btn" data-theme="2">
              <span class="theme-dot dot-pastel"></span>
              <span class="theme-name">Pastel Pop</span>
            </button>
            <button class="theme-option-btn" data-theme="3">
              <span class="theme-dot dot-cyber"></span>
              <span class="theme-name">Cyber Lo-Fi</span>
            </button>
            <button class="theme-option-btn" data-theme="4">
              <span class="theme-dot dot-win95"></span>
              <span class="theme-name">Win95 Retro</span>
            </button>
            <button class="theme-option-btn" data-theme="5">
              <span class="theme-dot dot-oled"></span>
              <span class="theme-name">OLED Emerald</span>
            </button>
          </div>
        </div>

        <!-- 2. Visual Effects Toggles -->
        <div class="menu-section">
          <div class="section-label">VISUAL EFFECTS</div>
          <div class="toggle-options-row">
            <button class="effect-toggle-btn active" id="menuToggleMesh">🌊 Fluid Aura: ON</button>
            <button class="effect-toggle-btn" id="menuTogglePixel">👾 8-Bit Art: OFF</button>
          </div>
          <div class="toggle-options-row" style="margin-top: 6px;">
            <button class="effect-toggle-btn" id="menuToggleCrt">⚡ CRT FX: OFF</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
